<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>🌌 Neon Rádio – Pesquisa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo-circle">📻</span>
      <div>
        <h1>Neon Rádio Online</h1>
        <p>Pesquisa global · Top 100 · Géneros · Países</p>
      </div>
    </div>
    <div class="top-right">
      <span id="clock"></span>
    </div>
  </header>

  <main class="search-container">
    <h2 class="search-title">Procura uma rádio</h2>

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Ex.: M80, Cidade FM, Antena 1, Radio Nova..."
    >

    <div class="search-status" id="searchStatus">
      Escreve o nome da rádio e carrega em Enter.
    </div>

    <div id="resultsContainer" class="results-container" style="margin-top:20px; display:none;">
      <h2 style="margin-bottom:12px;">🔎 Resultados da pesquisa</h2>
      <div id="resultsList" class="suggest-list"></div>
    </div>

    <div class="results-container" id="suggestions">
      <h2 style="margin-bottom:15px;">📡 Rádios em Destaque</h2>

      <h3 class="subcat">🌍 Top 100 do Mundo</h3>
      <div id="top100List" class="suggest-list"></div>

      <h3 class="subcat">🎧 Por Género</h3>
      <div class="genre-btns">
        <button type="button" onclick="loadGenre('pop')">Pop</button>
        <button type="button" onclick="loadGenre('rock')">Rock</button>
        <button type="button" onclick="loadGenre('dance')">Dance</button>
        <button type="button" onclick="loadGenre('news')">News</button>
        <button type="button" onclick="loadGenre('jazz')">Jazz</button>
        <button type="button" onclick="loadGenre('classical')">Classical</button>
      </div>
      <div id="genreList" class="suggest-list"></div>

      <h3 class="subcat">🇵🇹 Países</h3>
      <div class="country-btns">
        <button type="button" onclick="loadCountry('Portugal')">Portugal</button>
        <button type="button" onclick="loadCountry('Brazil')">Brasil</button>
        <button type="button" onclick="loadCountry('United States')">EUA</button>
        <button type="button" onclick="loadCountry('United Kingdom')">Reino Unido</button>
        <button type="button" onclick="loadCountry('Spain')">Espanha</button>
      </div>
      <div id="countryList" class="suggest-list"></div>
    </div>
  </main>

  <footer class="footer">
    <span>Neon Rádio Online · Feito pelo Rui 💙</span>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
